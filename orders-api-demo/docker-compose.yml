services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - orders_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  payment-gateway:
    image: mccutchen/go-httpbin:v2.15.0
    ports:
      - "8080:8080"

  app:
    build: .
    env_file: .env
    environment:
      POOL_MODE: ${POOL_MODE:-good}
    ports:
      - "8000:8000"
    volumes:
      - .:/srv
      - /srv/.venv
    depends_on:
      db:
        condition: service_healthy
      payment-gateway:
        condition: service_started
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

volumes:
  orders_pg_data:
