[project]
name = "orders-api-demo"
version = "0.1.0"
description = "PyCon HK 2026 — Why Your FastAPI Is Not Fast: Orders API demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "requests>=2.32",
    "faker>=30.0",
    "py-spy>=0.3.14",
    "locust>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
